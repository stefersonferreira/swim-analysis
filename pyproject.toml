[project]
name = "swim-analysis"
version = "0.1.0"
description = "Análise de provas de natação por vídeo: pipeline de visão, revisão e métricas"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115.12",
  "uvicorn[standard]>=0.34.2",
  "python-multipart>=0.0.20",
  "pydantic>=2.11.4",
  "pydantic-settings>=2.9.1",
  "sqlalchemy>=2.0.40",
  "alembic>=1.15.2",
  "psycopg[binary]>=3.2.9",
  "celery[redis]>=5.5.2",
  "numpy>=2.2.5",
  "opencv-python-headless>=4.11.0.86",
  "av>=14.0",
  "pyarrow>=20.0.0",
  "pandas>=2.2.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "httpx>=0.28.1",
  "ruff>=0.11.9",
  "pip-licenses>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/swimcv", "backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipeline", "backend"]
markers = [
  "postgres: precisa de um PostgreSQL acessível em TEST_DATABASE_URL",
  "video: usa ffmpeg e gera vídeos de teste",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # Depends()/File() em parâmetros é o padrão do FastAPI

[tool.ruff.lint.isort]
known-first-party = ["swimcv", "app", "tests"]
